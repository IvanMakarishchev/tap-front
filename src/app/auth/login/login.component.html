<form [formGroup]="loginForm" (ngSubmit)="login()">
  <mat-form-field>
    <mat-label>Email *</mat-label>
    <input formControlName="identifier" matInput />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Password *</mat-label>
    <input formControlName="password" matInput />
  </mat-form-field>
  <button type="submit" mat-button>Sign In</button>
</form>
<a [routerLink]="navAuth.Register">Register</a>
