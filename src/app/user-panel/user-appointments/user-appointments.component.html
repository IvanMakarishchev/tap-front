<mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
  <!-- Прошедшие встречи -->
  <mat-tab label="Appointments History">
    <ng-container
      *ngIf="previousAppointments$ | async as pAppointmentsData; else noData"
    >
      <ng-container *ngIf="pAppointmentsData.length; else noAppointments">
        <ng-container
          *ngTemplateOutlet="
            appointmentsTable;
            context: { $implicit: pAppointmentsData }
          "
        ></ng-container>
      </ng-container>
    </ng-container>
  </mat-tab>

  <!-- Будущие встречи -->
  <mat-tab label="Upcoming Appointments">
    <ng-container
      *ngIf="futureAppointments$ | async as fAppointmentsData; else noData"
    >
      <ng-container *ngIf="fAppointmentsData.length; else noAppointments">
        <ng-container
          *ngTemplateOutlet="
            appointmentsTable;
            context: { $implicit: fAppointmentsData }
          "
        ></ng-container>
      </ng-container>
    </ng-container>
  </mat-tab>
</mat-tab-group>

<!-- Повторно используемый шаблон таблицы -->
<ng-template #appointmentsTable let-dataSource>
  <table
    mat-table
    [dataSource]="dataSource"
    multiTemplateDataRows
    class="mat-elevation-z8"
  >
    <ng-container
      *ngFor="let column of columnsToDisplay"
      matColumnDef="{{ column }}"
    >
      <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
      <td mat-cell *matCellDef="let element">
        <ng-container [ngSwitch]="column">
          <ng-container *ngSwitchCase="'actions'">
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              aria-label="Appointment actions"
            >
              <mat-icon class="icon-small">more_horiz</mat-icon>
            </button>

            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="toggleEdit(element)">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item (click)="deleteAppointment(element)">
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </ng-container>

          <ng-container *ngSwitchDefault>
            {{ element[column] }}
          </ng-container>
        </ng-container>
      </td>
    </ng-container>

    <ng-container matColumnDef="expandedDetail">
      <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplay.length">
        <ng-container *ngIf="expandedElement$ | async as expandedElement">
          <div
            class="example-element-detail-wrapper"
            *ngIf="expandedElement.id === element.id"
          >
            <form [formGroup]="editForm">
                <mat-form-field>
                <mat-label>Am (TT/MM/JJJJ)</mat-label>
                <input matInput [matDatepicker]="datepicker" formControlName="date" />
                <mat-datepicker #datepicker />
                <mat-datepicker-toggle [for]="datepicker" matSuffix />
              </mat-form-field>
  
              <mat-form-field>
                <mat-label>Um</mat-label>
                <input matInput [matTimepicker]="timepicker" formControlName="time" />
                <mat-timepicker-toggle [for]="timepicker" matSuffix />
                <mat-timepicker interval="15min" #timepicker />
              </mat-form-field>
  
              <mat-form-field>
                <mat-label>Reason</mat-label>
                <input formControlName="reason" matInput>
              </mat-form-field>
  
              <button mat-button color="primary" (click)="saveEdit(expandedElement)">
                Save
              </button>
              <button mat-button color="warn" (click)="cancelEdit()">
                Cancel
              </button>
            </form>
          </div>
        </ng-container>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr
      mat-row
      *matRowDef="let element; columns: columnsToDisplay"
      class="example-element-row"
    ></tr>
    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
  </table>
</ng-template>

<!-- Общие шаблоны -->
<ng-template #noData> Fetching data... </ng-template>
<ng-template #noAppointments> You have no appointments </ng-template>
