<h2 mat-dialog-title>Tierdaten eingeben:</h2>
<form [formGroup]="newPetForm">
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Name des Tieres</mat-label>
      <input matInput formControlName="petName" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Typ des Tieres</mat-label>
      <mat-select formControlName="petType">
          <mat-option value="Cat">Cat</mat-option>
          <mat-option value="Dog">Dog</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Registrationsnummer</mat-label>
      <input matInput formControlName="regNumber" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Chipnummer</mat-label>
      <input matInput formControlName="chipNumber" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Ihre Notizen</mat-label>
      <textarea matInput formControlName="userNotes"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button color="primary" [mat-dialog-close]="newPetForm.value">
      Save
    </button>
    <button mat-button color="warn" (click)="onClose()">Cancel</button>
  </mat-dialog-actions>
</form>
